name: approc_image_picker
description: Pick and crop a document, then rotate, resize, and compress it to a JPEG.
version: 1.2.0
homepage: https://github.com/NASO7Y/ocr_egyptian_ID
publish_to: 'none' # path dependency on forked cunning_document_scanner

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  # Forked: camera → capture then manual corner crop (no ML Kit / VisionKit auto-detect).
  cunning_document_scanner:
    path: packages/cunning_document_scanner
  image: ^4.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
